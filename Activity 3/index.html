<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style background-attachment: fixed;></style>
</head>

<body>
    <form>
        <div class="form-container">
            <h1> Student Registration Form</h1>
            <form action="#" method="post"></form>
        </div>
        <div class="RollNo.">
            <label for="RollNo">Roll No.</label>
            <input type="text" placeholder="number">
        </div>
        <br>
        <div class="StudentName">
            <label for="name">Student Name:</label>
            <input type="text" placeholder="Given Name" style="width: 5rem;">
            <input type="text" placeholder="Last Name">
        </div>
        <br>
        <div class="FathersName">
            <label for="Father-name">Father's Name:</label>
            <input type="text" placeholder="Father's Name">
        </div>
        <br>
        <div class="MothersName">
            <label for="mother-name">Mother's Name:</label>
            <input type="text" placeholder="Mothe's Name">
        </div>
        <br>
        <div class="birth">
            <label for="dob">Date of Birth:</label>
            <input type="Date">
        </div>
        <br>
        <div class="MobileNo">
            <label for="number">Mobile No.:</label>
            <input type="text" placeholder="+63" style="width: 3rem;"><span></span>
            <input type="text" placeholder="XXX XXX XXXX">
        </div>
        <br>
        <div class="Email">
            <label for="email">Email:</label>
            <input type="email" placeholder="Enter your email">
        </div>
        <br>
        <div class="Password">
            <label for="Password">Password:</label>
            <input type="password" placeholder="Create a Password">
        </div>
        <br>
        <div class="Gender">
            <label for="gender">Gender:</label>
            <input type="radio" name="gender" value="male" id="male">
            <label for="male">Male</label>
            <input type="radio" name="gender" value="female" id="female">
            <label for="female">Female</label>
        </div>
        <br>
        <div class="Department">
            <label for="Department">Department:</label>
            <input type="checkbox" name="Department" value="Computer Science"> CS
            <input type="checkbox" name="Department" value="Informatiuon Technology"> IT
            <input type="checkbox" name="Department" value="Electronics"> EC
        </div>
        <br>
        <div class="Course">
            <label for="Course">Course:</label>
            <select>
                <option>BSIT</option>
                <option>BSCS</option>
                <option>BPA</option>
            </select>
        </div>
        <br>
        <div class="StudentPhoto">
            <label for="Student Photo">Student Photo:</label>
            <button type="submit">Choose File</button> No File Chosen
        </div>
        <br>
        <div class="City">
            <label for="City">City :</label>
            <input type="text" name="City" placeholder="Enter your city" style="width: 15rem;">
        </div>
        <br>

        <div class="Address">
            <label for="Address">Address :</label>
            <input type="text" name="Address" placeholder="Enter your address" style="width: 15rem; height: 2rem;">
        </div>
        <br>
        <div class="Register"><br>
            <button type="submit"> Register</button>
        </div>
    </form>
</body>

</html>
